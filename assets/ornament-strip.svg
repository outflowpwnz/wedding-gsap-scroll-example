    <ellipse cx="12"  cy="0"  rx="9" ry="6" fill="#FBF5EC"/>
    <ellipse cx="-8"  cy="-8" rx="6" ry="9" transform="rotate(-45,-8,-8)" fill="#FBF5EC"/>
    <ellipse cx="8"   cy="-8" rx="6" ry="9" transform="rotate(45,8,-8)"   fill="#FBF5EC"/>
    <ellipse cx="-8"  cy="8"  rx="6" ry="9" transform="rotate(45,-8,8)"   fill="#FBF5EC"/>
    <ellipse cx="8"   cy="8"  rx="6" ry="9" transform="rotate(-45,8,8)"   fill="#FBF5EC"/>
    <circle cx="0" cy="0" r="8" fill="#C4882A"/>
    <circle cx="0" cy="0" r="4" fill="#8B1A1A"/>
    <circle cx="0" cy="0" r="2" fill="#C4882A"/>
  </g>

  <!-- Leaf (base at 0,0 tip points up) -->
  <g id="leaf">
    <path d="M0,0 Q-9,-12 0,-28 Q9,-12 0,0Z" fill="#FBF5EC"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#C4882A" stroke-width="1" opacity="0.5"/>
  </g>
