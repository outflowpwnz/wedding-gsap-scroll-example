<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">

  <!-- ===== BORDER LINES ===== -->
  <line x1="0" y1="1.5"  x2="80" y2="1.5"  stroke="#8B1A1A" stroke-width="1.5"/>
  <line x1="0" y1="48.5" x2="80" y2="48.5" stroke="#8B1A1A" stroke-width="1.5"/>

  <!-- Gold diamonds along top border -->
  <path d="M10,0  L11.8,1.5 L10,3   L8.2,1.5Z"  fill="#C4882A"/>
  <path d="M30,0  L31.8,1.5 L30,3   L28.2,1.5Z" fill="#C4882A"/>
  <path d="M50,0  L51.8,1.5 L50,3   L48.2,1.5Z" fill="#C4882A"/>
  <path d="M70,0  L71.8,1.5 L70,3   L68.2,1.5Z" fill="#C4882A"/>
  <!-- Half-diamonds at seam edges (tile at x=0/80) -->
  <path d="M0,0   L1.8,1.5  L0,3Z"              fill="#C4882A"/>
  <path d="M80,0  L78.2,1.5 L80,3Z"             fill="#C4882A"/>

  <!-- Gold diamonds along bottom border -->
  <path d="M10,47  L11.8,48.5 L10,50   L8.2,48.5Z"  fill="#C4882A"/>
  <path d="M30,47  L31.8,48.5 L30,50   L28.2,48.5Z" fill="#C4882A"/>
  <path d="M50,47  L51.8,48.5 L50,50   L48.2,48.5Z" fill="#C4882A"/>
  <path d="M70,47  L71.8,48.5 L70,50   L68.2,48.5Z" fill="#C4882A"/>
  <path d="M0,47   L1.8,48.5  L0,50Z"               fill="#C4882A"/>
  <path d="M80,47  L78.2,48.5 L80,50Z"              fill="#C4882A"/>

  <!-- Fine inner border lines (gold, inset) -->
  <line x1="0" y1="4"  x2="80" y2="4"  stroke="#C4882A" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="46" x2="80" y2="46" stroke="#C4882A" stroke-width="0.5" opacity="0.6"/>

  <!-- ===== VINE S-CURVE ===== -->
  <path d="M0,25 C14,11 30,39 40,25 C50,11 66,39 80,25"
        stroke="#8B1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ===== FLOWERS ===== -->

  <!-- Flower at seam x=0/80 — LEFT half (right side of tile) drawn at x=80,
       RIGHT half (left side of tile) drawn at x=0; they meet when tiled -->

  <!-- Left half at x=80 (clips at right edge, completes on next tile) -->
  <ellipse cx="80"  cy="18" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="80"  cy="32" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="76"  cy="21" rx="2.5" ry="5.5" transform="rotate(-60,76,21)" fill="#8B1A1A"/>
  <ellipse cx="84"  cy="21" rx="2.5" ry="5.5" transform="rotate(60,84,21)"  fill="#8B1A1A"/>
  <ellipse cx="76"  cy="29" rx="2.5" ry="5.5" transform="rotate(60,76,29)"  fill="#8B1A1A"/>
  <ellipse cx="84"  cy="29" rx="2.5" ry="5.5" transform="rotate(-60,84,29)" fill="#8B1A1A"/>
  <circle cx="74.5" cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="85.5" cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="80"   cy="13" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="80"   cy="37" r="1"   fill="#C4882A" opacity="0.8"/>
  <!-- Inner petals (30° offset, smaller) -->
  <ellipse cx="82"  cy="21.5" rx="2.0" ry="4.5" transform="rotate(30,82,21.5)"   fill="#8B1A1A"/>
  <ellipse cx="84"  cy="25"   rx="2.0" ry="4.5" transform="rotate(90,84,25)"     fill="#8B1A1A"/>
  <ellipse cx="82"  cy="28.5" rx="2.0" ry="4.5" transform="rotate(150,82,28.5)"  fill="#8B1A1A"/>
  <ellipse cx="78"  cy="28.5" rx="2.0" ry="4.5" transform="rotate(210,78,28.5)"  fill="#8B1A1A"/>
  <ellipse cx="76"  cy="25"   rx="2.0" ry="4.5" transform="rotate(270,76,25)"    fill="#8B1A1A"/>
  <ellipse cx="78"  cy="21.5" rx="2.0" ry="4.5" transform="rotate(330,78,21.5)"  fill="#8B1A1A"/>
  <circle cx="80" cy="25" r="4"   fill="#C4882A"/>
  <circle cx="80" cy="25" r="2.4" fill="#8B1A1A"/>
  <circle cx="80" cy="25" r="1.2" fill="#C4882A"/>
  <circle cx="80" cy="25" r="0.5" fill="#8B1A1A"/>

  <!-- Right half at x=0 (clips at left edge, visible portion completes the flower) -->
  <ellipse cx="0"  cy="18" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="0"  cy="32" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="-4" cy="21" rx="2.5" ry="5.5" transform="rotate(-60,-4,21)" fill="#8B1A1A"/>
  <ellipse cx="4"  cy="21" rx="2.5" ry="5.5" transform="rotate(60,4,21)"   fill="#8B1A1A"/>
  <ellipse cx="-4" cy="29" rx="2.5" ry="5.5" transform="rotate(60,-4,29)"  fill="#8B1A1A"/>
  <ellipse cx="4"  cy="29" rx="2.5" ry="5.5" transform="rotate(-60,4,29)"  fill="#8B1A1A"/>
  <circle cx="-5.5" cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="5.5"  cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="0"    cy="13" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="0"    cy="37" r="1"   fill="#C4882A" opacity="0.8"/>
  <!-- Inner petals (30° offset, smaller) -->
  <ellipse cx="2"  cy="21.5" rx="2.0" ry="4.5" transform="rotate(30,2,21.5)"    fill="#8B1A1A"/>
  <ellipse cx="4"  cy="25"   rx="2.0" ry="4.5" transform="rotate(90,4,25)"      fill="#8B1A1A"/>
  <ellipse cx="2"  cy="28.5" rx="2.0" ry="4.5" transform="rotate(150,2,28.5)"   fill="#8B1A1A"/>
  <ellipse cx="-2" cy="28.5" rx="2.0" ry="4.5" transform="rotate(210,-2,28.5)"  fill="#8B1A1A"/>
  <ellipse cx="-4" cy="25"   rx="2.0" ry="4.5" transform="rotate(270,-4,25)"    fill="#8B1A1A"/>
  <ellipse cx="-2" cy="21.5" rx="2.0" ry="4.5" transform="rotate(330,-2,21.5)"  fill="#8B1A1A"/>
  <circle cx="0" cy="25" r="4"   fill="#C4882A"/>
  <circle cx="0" cy="25" r="2.4" fill="#8B1A1A"/>
  <circle cx="0" cy="25" r="1.2" fill="#C4882A"/>
  <circle cx="0" cy="25" r="0.5" fill="#8B1A1A"/>

  <!-- Flower at x=40 (center) -->
  <ellipse cx="40"  cy="18" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="40"  cy="32" rx="2.5" ry="5.5" fill="#8B1A1A"/>
  <ellipse cx="36"  cy="21" rx="2.5" ry="5.5" transform="rotate(-60,36,21)" fill="#8B1A1A"/>
  <ellipse cx="44"  cy="21" rx="2.5" ry="5.5" transform="rotate(60,44,21)"  fill="#8B1A1A"/>
  <ellipse cx="36"  cy="29" rx="2.5" ry="5.5" transform="rotate(60,36,29)"  fill="#8B1A1A"/>
  <ellipse cx="44"  cy="29" rx="2.5" ry="5.5" transform="rotate(-60,44,29)" fill="#8B1A1A"/>
  <!-- Inter-petal accent dots -->
  <circle cx="34.5" cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="45.5" cy="25" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="40"   cy="13" r="1"   fill="#C4882A" opacity="0.8"/>
  <circle cx="40"   cy="37" r="1"   fill="#C4882A" opacity="0.8"/>
  <!-- Inner petals (30° offset, smaller) -->
  <ellipse cx="42"  cy="21.5" rx="2.0" ry="4.5" transform="rotate(30,42,21.5)"   fill="#8B1A1A"/>
  <ellipse cx="44"  cy="25"   rx="2.0" ry="4.5" transform="rotate(90,44,25)"     fill="#8B1A1A"/>
  <ellipse cx="42"  cy="28.5" rx="2.0" ry="4.5" transform="rotate(150,42,28.5)"  fill="#8B1A1A"/>
  <ellipse cx="38"  cy="28.5" rx="2.0" ry="4.5" transform="rotate(210,38,28.5)"  fill="#8B1A1A"/>
  <ellipse cx="36"  cy="25"   rx="2.0" ry="4.5" transform="rotate(270,36,25)"    fill="#8B1A1A"/>
  <ellipse cx="38"  cy="21.5" rx="2.0" ry="4.5" transform="rotate(330,38,21.5)"  fill="#8B1A1A"/>
  <!-- Center -->
  <circle cx="40" cy="25" r="4"   fill="#C4882A"/>
  <circle cx="40" cy="25" r="2.4" fill="#8B1A1A"/>
  <circle cx="40" cy="25" r="1.2" fill="#C4882A"/>
  <circle cx="40" cy="25" r="0.5" fill="#8B1A1A"/>

  <!-- ===== MAIN LEAVES ===== -->

  <!-- Up-leaves at vine peaks (x≈14, x≈54) — with mid-rib -->
  <path d="M14,14 Q10,3 14,0  Q18,3 14,14Z" fill="#8B1A1A"/>
  <line x1="14" y1="14" x2="14" y2="2" stroke="#C4882A" stroke-width="0.7" opacity="0.7"/>
  <path d="M54,14 Q50,3 54,0  Q58,3 54,14Z" fill="#8B1A1A"/>
  <line x1="54" y1="14" x2="54" y2="2" stroke="#C4882A" stroke-width="0.7" opacity="0.7"/>

  <!-- Down-leaves at vine troughs (x≈30, x≈70) — with mid-rib -->
  <path d="M30,36 Q26,47 30,50 Q34,47 30,36Z" fill="#8B1A1A"/>
  <line x1="30" y1="36" x2="30" y2="48" stroke="#C4882A" stroke-width="0.7" opacity="0.7"/>
  <path d="M70,36 Q66,47 70,50 Q74,47 70,36Z" fill="#8B1A1A"/>
  <line x1="70" y1="36" x2="70" y2="48" stroke="#C4882A" stroke-width="0.7" opacity="0.7"/>

  <!-- Small side leaflets beside up-leaves -->
  <path d="M11,11 Q5,7 8,4   Q11,8 11,11Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M17,11 Q23,7 20,4  Q17,8 17,11Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M51,11 Q45,7 48,4  Q51,8 51,11Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M57,11 Q63,7 60,4  Q57,8 57,11Z" fill="#8B1A1A" opacity="0.85"/>

  <!-- Small side leaflets beside down-leaves -->
  <path d="M27,39 Q21,43 24,46 Q27,42 27,39Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M33,39 Q39,43 36,46 Q33,42 33,39Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M67,39 Q61,43 64,46 Q67,42 67,39Z" fill="#8B1A1A" opacity="0.85"/>
  <path d="M73,39 Q79,43 76,46 Q73,42 73,39Z" fill="#8B1A1A" opacity="0.85"/>

  <!-- ===== GOLD BUDS at leaf bases ===== -->
  <circle cx="14" cy="14" r="2.5" fill="#C4882A"/>
  <circle cx="54" cy="14" r="2.5" fill="#C4882A"/>
  <circle cx="30" cy="36" r="2.5" fill="#C4882A"/>
  <circle cx="70" cy="36" r="2.5" fill="#C4882A"/>
  <!-- Inner dot -->
  <circle cx="14" cy="14" r="1"   fill="#8B1A1A"/>
  <circle cx="54" cy="14" r="1"   fill="#8B1A1A"/>
  <circle cx="30" cy="36" r="1"   fill="#8B1A1A"/>
  <circle cx="70" cy="36" r="1"   fill="#8B1A1A"/>

  <!-- ===== VINE TENDRILS ===== -->
  <!-- Curling off the upper peaks -->
  <path d="M11,15 Q5,12 7,8 Q9,5 12,7"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="12" cy="7" r="1.2" fill="#8B1A1A"/>

  <path d="M17,15 Q23,12 21,8 Q19,5 16,7"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="16" cy="7" r="1.2" fill="#8B1A1A"/>

  <path d="M51,15 Q45,12 47,8 Q49,5 52,7"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="7" r="1.2" fill="#8B1A1A"/>

  <path d="M57,15 Q63,12 61,8 Q59,5 56,7"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="56" cy="7" r="1.2" fill="#8B1A1A"/>

  <!-- Curling off the lower troughs -->
  <path d="M27,35 Q21,38 23,42 Q25,45 28,43"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="28" cy="43" r="1.2" fill="#8B1A1A"/>

  <path d="M33,35 Q39,38 37,42 Q35,45 32,43"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="32" cy="43" r="1.2" fill="#8B1A1A"/>

  <path d="M67,35 Q61,38 63,42 Q65,45 68,43"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="68" cy="43" r="1.2" fill="#8B1A1A"/>

  <path d="M73,35 Q79,38 77,42 Q75,45 72,43"
        stroke="#8B1A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="43" r="1.2" fill="#8B1A1A"/>

  <!-- ===== SMALL DOT ACCENTS along vine ===== -->
  <!-- Midpoints between flowers and leaf buds -->
  <circle cx="7"  cy="22" r="1.2" fill="#C4882A" opacity="0.7"/>
  <circle cx="22" cy="30" r="1.2" fill="#C4882A" opacity="0.7"/>
  <circle cx="47" cy="22" r="1.2" fill="#C4882A" opacity="0.7"/>
  <circle cx="62" cy="30" r="1.2" fill="#C4882A" opacity="0.7"/>

</svg>
