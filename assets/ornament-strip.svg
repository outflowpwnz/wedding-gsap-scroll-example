    <circle cx="59" cy="-14" r="2.5" fill="#FBF5EC"/>
    <path d="M68,-8 L84,-3 L68,2Z" fill="#C4882A"/>
    <path d="M40,-26 Q33,-52 38,-74 Q45,-52 40,-26Z" fill="#FBF5EC"/>
    <path d="M48,-28 Q45,-56 52,-78 Q57,-56 48,-28Z" fill="#FBF5EC"/>
    <path d="M55,-25 Q58,-50 66,-70 Q62,-50 55,-25Z" fill="#FBF5EC"/>
    <circle cx="38" cy="-74" r="5" fill="#C4882A"/>
    <circle cx="52" cy="-78" r="5" fill="#C4882A"/>
    <circle cx="66" cy="-70" r="5" fill="#C4882A"/>
