  fill="none" stroke="#C4882A" stroke-width="2" stroke-linejoin="miter"/>
<line x1="0" y1="22" x2="800" y2="22" stroke="#FBF5EC" stroke-width="1.5"/>

<!-- ===== BOTTOM BORDER ===== -->
<line x1="0" y1="178" x2="800" y2="178" stroke="#FBF5EC" stroke-width="1.5"/>
<polyline
  points="0,195 16,178 32,195 48,178 64,195 80,178 96,195 112,178 128,195 144,178 160,195 176,178 192,195 208,178 224,195 240,178 256,195 272,178 288,195 304,178 320,195 336,178 352,195 368,178 384,195 400,178 416,195 432,178 448,195 464,178 480,195 496,178 512,195 528,178 544,195 560,178 576,195 592,178 608,195 624,178 640,195 656,178 672,195 688,178 704,195 720,178 736,195 752,178 768,195 784,178 800,195"
  fill="none" stroke="#C4882A" stroke-width="2" stroke-linejoin="miter"/>
<line x1="0" y1="195" x2="800" y2="195" stroke="#FBF5EC" stroke-width="2.5"/>

<!-- ===== LEFT BIRD ===== -->
<g transform="translate(148,102)">
  <use href="#bird"/>
</g>

<!-- ===== RIGHT BIRD (mirror) ===== -->
<g transform="translate(652,102) scale(-1,1)">
  <use href="#bird"/>
</g>

<!-- ===== LEFT VINE ===== -->
<path d="M228,150 C268,136 328,152 400,148" stroke="#FBF5EC" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<!-- Leaves -->
<g transform="translate(258,144) rotate(0)"><use href="#leaf"/></g>
<g transform="translate(258,148) rotate(180)"><use href="#leaf"/></g>
<g transform="translate(310,148) rotate(-10)"><use href="#leaf"/></g>
<g transform="translate(310,152) rotate(175)"><use href="#leaf"/></g>
<g transform="translate(358,146) rotate(10)"><use href="#leaf"/></g>
<g transform="translate(358,150) rotate(170)"><use href="#leaf"/></g>
<!-- Flowers on vine -->
<g transform="translate(284,132)"><use href="#flower-sm" transform="scale(0.65)"/></g>
<g transform="translate(336,134)"><use href="#flower-sm" transform="scale(0.6)"/></g>

<!-- ===== RIGHT VINE ===== -->
<path d="M572,150 C532,136 472,152 400,148" stroke="#FBF5EC" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<!-- Leaves -->
<g transform="translate(542,144) rotate(0)"><use href="#leaf"/></g>
<g transform="translate(542,148) rotate(180)"><use href="#leaf"/></g>
<g transform="translate(490,148) rotate(10)"><use href="#leaf"/></g>
<g transform="translate(490,152) rotate(185)"><use href="#leaf"/></g>
<g transform="translate(442,146) rotate(-10)"><use href="#leaf"/></g>
<g transform="translate(442,150) rotate(190)"><use href="#leaf"/></g>
<!-- Flowers on vine -->
<g transform="translate(516,132)"><use href="#flower-sm" transform="scale(0.65)"/></g>
<g transform="translate(464,134)"><use href="#flower-sm" transform="scale(0.6)"/></g>

<!-- ===== CENTRAL TREE OF LIFE ===== -->
<!-- Main stem -->
<line x1="400" y1="162" x2="400" y2="34" stroke="#FBF5EC" stroke-width="4" stroke-linecap="round"/>

<!-- Upper branches + flowers -->
<path d="M400,72 Q376,58 358,48" stroke="#FBF5EC" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M400,72 Q424,58 442,48" stroke="#FBF5EC" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(356,46)"><use href="#flower-sm"/></g>
<g transform="translate(444,46)"><use href="#flower-sm"/></g>

<!-- Mid branches + leaves -->
<path d="M400,106 Q370,90 348,80" stroke="#FBF5EC" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M400,106 Q430,90 452,80" stroke="#FBF5EC" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<g transform="translate(344,78) rotate(20)"><use href="#leaf"/></g>
<g transform="translate(456,78) rotate(-20)"><use href="#leaf"/></g>

<!-- Lower branches + small flowers -->
<path d="M400,132 Q378,120 362,114" stroke="#FBF5EC" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M400,132 Q422,120 438,114" stroke="#FBF5EC" stroke-width="2" fill="none" stroke-linecap="round"/>
<g transform="translate(360,112)"><use href="#flower-sm" transform="scale(0.6)"/></g>
<g transform="translate(440,112)"><use href="#flower-sm" transform="scale(0.6)"/></g>

<!-- Top large flower -->
<g transform="translate(400,42)"><use href="#flower-lg"/></g>

<!-- Base berries -->
<circle cx="390" cy="157" r="5" fill="#C4882A"/>
<circle cx="400" cy="160" r="5" fill="#C4882A"/>
<circle cx="410" cy="157" r="5" fill="#C4882A"/>

</svg>
