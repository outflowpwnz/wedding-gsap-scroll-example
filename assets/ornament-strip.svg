    <path d="M-12,16 Q-42,18 -68,14 Q-42,22 -12,16Z" fill="#FBF5EC"/>
    <path d="M-10,20 Q-36,30 -58,44 Q-34,30 -10,20Z" fill="#FBF5EC"/>
    <circle cx="-50" cy="-48" r="5.5" fill="#C4882A"/>
    <circle cx="-61" cy="-30" r="5.5" fill="#C4882A"/>
    <circle cx="-67" cy="-8"  r="5.5" fill="#C4882A"/>
    <circle cx="-67" cy="14"  r="5.5" fill="#C4882A"/>
    <circle cx="-57" cy="44"  r="5.5" fill="#C4882A"/>
    <ellipse cx="12" cy="12" rx="42" ry="28" fill="#FBF5EC"/>
