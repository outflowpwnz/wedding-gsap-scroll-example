    <line x1="12" y1="54" x2="2"  y2="64" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="54" x2="13" y2="66" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="54" x2="24" y2="64" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="38" x2="24" y2="54" stroke="#FBF5EC" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="54" x2="14" y2="64" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="54" x2="25" y2="66" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="54" x2="36" y2="64" stroke="#FBF5EC" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Large 8-petal flower -->
  <g id="flower-lg">
    <ellipse cx="0"   cy="-22" rx="9" ry="14" fill="#FBF5EC"/>
    <ellipse cx="0"   cy="22"  rx="9" ry="14" fill="#FBF5EC"/>
    <ellipse cx="-22" cy="0"   rx="14" ry="9" fill="#FBF5EC"/>
    <ellipse cx="22"  cy="0"   rx="14" ry="9" fill="#FBF5EC"/>
    <ellipse cx="-15" cy="-15" rx="9" ry="14" transform="rotate(-45,-15,-15)" fill="#FBF5EC"/>
    <ellipse cx="15"  cy="-15" rx="9" ry="14" transform="rotate(45,15,-15)"   fill="#FBF5EC"/>
    <ellipse cx="-15" cy="15"  rx="9" ry="14" transform="rotate(45,-15,15)"   fill="#FBF5EC"/>
    <ellipse cx="15"  cy="15"  rx="9" ry="14" transform="rotate(-45,15,15)"   fill="#FBF5EC"/>
    <circle cx="0" cy="0" r="14" fill="#C4882A"/>
    <circle cx="0" cy="0" r="8"  fill="#8B1A1A"/>
    <circle cx="0" cy="0" r="4"  fill="#C4882A"/>
  </g>

  <!-- Small 8-petal flower -->
  <g id="flower-sm">
    <ellipse cx="0"  cy="-12" rx="6" ry="9" fill="#FBF5EC"/>
    <ellipse cx="0"  cy="12"  rx="6" ry="9" fill="#FBF5EC"/>
